<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>استخاره دستی با قرآن</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f0f3ed;color:#26382c;font-family:Tahoma,Arial;line-height:1.9}
main{max-width:850px;margin:auto;padding:14px}
header{text-align:center;padding:18px 8px;color:#245b40}
header h1{font-size:25px;margin:0 0 5px}
section{background:white;border:1px solid #dce5db;border-radius:16px;padding:18px;margin:14px 0}
.intro{text-align:center;color:#5e6b60}
.book-area{max-width:620px;margin:24px auto 15px;padding:12px 8px 20px}
.book{height:100px;position:relative;cursor:crosshair;touch-action:pan-y;border-radius:5px 12px 12px 5px;
background:repeating-linear-gradient(to bottom,#fffdf1 0,#e4e0cf 1px,#fffdf5 3px,#e7e2d2 4px);
border:1px solid #c4bca7;box-shadow:0 7px 0 #d2c7ad,0 10px 0 #b9ac91,0 14px 18px #0002;
overflow:hidden;user-select:none}
.book:before{content:"";position:absolute;inset:0 auto 0 0;width:18px;background:linear-gradient(90deg,#28543a,#477953,#203e2c);border-right:2px solid #9a885b}
.book:after{content:"";position:absolute;inset:0 0 0 20px;background:repeating-linear-gradient(to right,transparent 0,transparent 3px,#b7b09e 4px,#fffdf4 5px);opacity:.45;pointer-events:none}
.indicator{position:absolute;z-index:2;top:0;bottom:0;width:3px;background:#bd4532;box-shadow:0 0 5px #8c1d16;left:72.7%;pointer-events:none}
.indicator:before,.indicator:after{content:"";position:absolute;left:-5px;width:13px;height:5px;background:#bd4532;border-radius:3px}
.indicator:before{top:0}.indicator:after{bottom:0}
.hint{text-align:center;font-size:13px;color:#657368;margin:25px 0 6px}
.selection{text-align:center;margin:14px 0;font-size:17px}
.selection strong{color:#245b40;font-size:23px}
.actions{text-align:center}
button{font:inherit;border:0;border-radius:9px;background:#245b40;color:white;padding:11px 22px;cursor:pointer}
button:disabled{opacity:.55}
#status{text-align:center;color:#56665a;overflow-wrap:anywhere}
#result[hidden]{display:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{border:1px solid #e0e7de;border-radius:10px;padding:12px;overflow-wrap:anywhere}
.item b{display:block;color:#42654b;margin-bottom:3px}
.wide{grid-column:1/-1}
.quran-img{width:100%;height:auto}
a{color:#245b40}
footer{text-align:center;color:#738074;font-size:12px;padding:15px}
@media(max-width:550px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.book{height:76px}header h1{font-size:21px}}
</style>
</head>
<body>
<main>
<header>
<h1>استخاره دستی با قرآن</h1>
<div>نیت کنید و سپس صفحه‌ای از کتاب را انتخاب کنید</div>
</header>

<section>
<p class="intro">برای انتخاب صفحه، روی لبه‌های کتاب کلیک کنید یا انگشت خود را روی آن بکشید.</p>
<div class="book-area">
<div class="book" id="book" role="slider" tabindex="0"
 aria-label="انتخاب صفحه قرآن" aria-valuemin="1" aria-valuemax="603" aria-valuenow="165">
<div class="indicator" id="indicator"></div>
</div>
<div class="selection">صفحه انتخاب‌شده: <strong id="pageNo">۱۶۵</strong> از ۶۰۳</div>
<div class="actions"><button id="go">مشاهده نتیجه استخاره</button></div>
<div class="hint">می‌توانید روی بخش‌های مختلف کتاب کلیک کنید تا صفحه دلخواه انتخاب شود.</div>
</div>
<p id="status" role="status"></p>
</section>

<section id="result" hidden></section>
<footer>متن قرآن از داده‌های ذخیره‌شده محلی</footer>
</main>

<script>
const book = document.querySelector('#book');
const indicator = document.querySelector('#indicator');
const pageNo = document.querySelector('#pageNo');
let selected = 165;
let dragging = false;

function digits(n) {
  return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[Number(d)]);
}

function setPage(n) {
  selected = Math.max(1, Math.min(603, Math.round(n)));
  pageNo.textContent = digits(selected);
  book.setAttribute('aria-valuenow', selected);
  indicator.style.left = (1 - (selected - 1) / 602) * 100 + '%';
}

function chooseAt(clientX) {
  const rect = book.getBoundingClientRect();
  const x = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
  setPage(1 + Math.round((1 - x) * 602));
}

function openResult() {
  window.location.href = '/result?page=' + selected;
}

book.addEventListener('pointerdown', e => {
  dragging = true;
  chooseAt(e.clientX);
  try { book.setPointerCapture(e.pointerId); } catch (_) {}
});

book.addEventListener('pointermove', e => {
  if (dragging) chooseAt(e.clientX);
});

book.addEventListener('pointerup', e => {
  if (!dragging) return;
  chooseAt(e.clientX);
  dragging = false;
  openResult();
});

book.addEventListener('pointercancel', () => {
  dragging = false;
});

book.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') {
    e.preventDefault();
    setPage(selected + 1);
  } else if (e.key === 'ArrowRight') {
    e.preventDefault();
    setPage(selected - 1);
  } else if (e.key === 'Enter') {
    e.preventDefault();
    openResult();
  }
});

setPage(165);
</script>

</body>
</html>
